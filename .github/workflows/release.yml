# Shared Electron release pipeline: michael-borck/app-hq/.github/workflows/electron-release.yml
name: Release desktop

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: michael-borck/app-hq/.github/workflows/electron-release.yml@main
    with:
      product-name: Study Buddy
      node-version: '20'
      build-command: npm run build
      package-command: npx electron-builder --$PLATFORM --publish never
      notarize-check-command: npx electron-builder --mac zip --arm64 --publish never
      notarize-check-artifact-root: dist
      signing-mode: custom
      notarize-mode: hook
      publish-mode: artifacts
      artifact-globs: |
        dist/*.dmg
        dist/*.zip
        dist/*.exe
        dist/*.AppImage
        dist/*.deb
        dist/*.rpm
        dist/*.blockmap
        dist/latest*.yml
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
